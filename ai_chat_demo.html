<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Stream Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px; }

    .page { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 20px; }

    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); padding: 24px 28px; }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
    .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; flex-shrink: 0; }

    label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 88px; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; resize: vertical; transition: border-color .15s; font-family: inherit; }
    textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    input[type=file] { display: block; margin-top: 4px; font-size: 13px; color: #475569; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

    .btn-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button { padding: 10px 28px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s, transform .1s; }
    button:hover { opacity: .92; }
    button:active { transform: scale(.97); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
    .status { font-size: 13px; color: #64748b; }

    .output-wrap { position: relative; }
    .output-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .output-label .tag { font-size: 11px; background: #eff6ff; color: #2563eb; padding: 2px 10px; border-radius: 20px; font-weight: 500; }
    .output { min-height: 200px; max-height: 440px; overflow-y: auto; padding: 16px 18px; background: #0f172a; color: #e2e8f0; border-radius: 10px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-family: "Menlo", "Consolas", "Courier New", monospace; }
    .output .assistant { color: #93c5fd; }
    .output .system  { color: #64748b; font-size: 12px; }
    .output .error  { color: #f87171; }
    .output .done   { color: #34d399; font-weight: 600; }

    .artifact-list { display: flex; flex-direction: column; gap: 10px; }
    .artifact-card { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; transition: border-color .15s; }
    .artifact-card:hover { border-color: #93c5fd; }
    .artifact-icon { width: 40px; height: 40px; border-radius: 10px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .artifact-body { flex: 1; min-width: 0; }
    .artifact-name { font-size: 14px; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artifact-meta { font-size: 12px; color: #64748b; margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
    .artifact-actions { display: flex; gap: 8px; margin-top: 8px; }
    .artifact-actions button { padding: 5px 14px; font-size: 12px; border-radius: 8px; background: #2563eb; color: #fff; border: none; cursor: pointer; }
    .artifact-actions button.secondary { background: #e2e8f0; color: #334155; }
    .artifact-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
    .artifact-status.writing { background: #fef3c7; color: #92400e; }
    .artifact-status.done     { background: #dcfce7; color: #166534; }
    .artifact-status.failed   { background: #fee2e2; color: #991b1b; }
    .artifact-status.embedded { background: #eff6ff; color: #1e40af; }

    .empty-state { text-align: center; padding: 32px 16px; color: #94a3b8; font-size: 13px; }

    .tool-log { font-size: 12px; color: #64748b; max-height: 160px; overflow-y: auto; padding: 10px 14px; background: #f8fafc; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; font-family: "Menlo", monospace; }
    .tool-log .line { display: flex; gap: 8px; }
    .tool-log .ts { color: #94a3b8; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="page">

    <!-- 输入区 -->
    <div class="card">
      <h2><span class="dot"></span>发送请求</h2>
      <label for="content">content（对话内容）</label>
      <textarea id="content" placeholder="请输入内容，例如：请帮我生成一份周报，包含本周完成事项和下周计划。"></textarea>

      <label for="files" style="margin-top:16px;">files（可选，支持上传 Excel）</label>
      <input id="files" type="file" multiple accept=".xlsx,.xls,.xlsm,.csv" />
      <div class="hint">上传 Excel 后，文件内容会被解析为 Markdown 并注入 prompt 上下文。</div>

      <div class="btn-row">
        <button id="sendBtn">开始流式调用</button>
        <span class="status" id="status">就绪</span>
      </div>
    </div>

    <!-- 文本输出区 -->
    <div class="card output-wrap">
      <div class="output-label">
        <h2><span class="dot" style="background:#34d399"></span>AI 输出</h2>
        <span class="tag" id="charCount">0 字</span>
      </div>
      <div class="output" id="output"><span class="system">等待请求...</span></div>
    </div>

    <!-- 制品区 -->
    <div class="card">
      <h2><span class="dot" style="background:#f59e0b"></span>生成制品</h2>
      <div class="artifact-list" id="artifactList">
        <div class="empty-state" id="artifactEmpty">暂无制品，Agent 生成文件后会显示在这里</div>
      </div>
    </div>

    <!-- 工具调用日志 -->
    <div class="card">
      <h2><span class="dot" style="background:#8b5cf6"></span>工具调用日志</h2>
      <div class="tool-log" id="toolLog">
        <span class="system">等待中...</span>
      </div>
    </div>

  </div>

  <script>
    var sendBtn    = document.getElementById('sendBtn');
    var output      = document.getElementById('output');
    var statusEl    = document.getElementById('status');
    var contentEl   = document.getElementById('content');
    var filesEl     = document.getElementById('files');
    var charCount   = document.getElementById('charCount');
    var artifactList = document.getElementById('artifactList');
    var artifactEmpty = document.getElementById('artifactEmpty');
    var toolLog     = document.getElementById('toolLog');

    var API_URL = '/yyy/ai/chat';

    var artifactCounter = 0;
    var artifacts = {};
    var fullText = '';

    function ts() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function logTool(text) {
      var span = document.createElement('span');
      span.className = 'line';
      span.innerHTML = '<span class="ts">[' + ts() + ']</span> ' + escapeHtml(text);
      if (toolLog.querySelector('.system')) toolLog.innerHTML = '';
      toolLog.appendChild(span);
      toolLog.scrollTop = toolLog.scrollHeight;
    }

    function updateCharCount() {
      charCount.textContent = fullText.length + ' 字';
    }

    // ---- 制品卡片 ----
    function makeArtifactCard(id, data) {
      artifactEmpty.style.display = 'none';

      var card = document.createElement('div');
      card.className = 'artifact-card';
      card.id = 'artifact-' + id;

      var mime = data.mime_type || '';
      var isImg = mime.indexOf('image/') === 0;
      var icon = '';
      if (mime.indexOf('spreadsheet') !== -1 || mime.indexOf('excel') !== -1) icon = '📊';
      else if (mime.indexOf('pdf') !== -1) icon = '📄';
      else if (mime.indexOf('word') !== -1) icon = '📝';
      else if (mime.indexOf('csv') !== -1) icon = '📋';
      else if (isImg) icon = '🖼️';
      else icon = '📁';

      var sizeStr = '';
      if (data.size != null) {
        sizeStr = data.size < 1024
          ? data.size + ' B'
          : (data.size / 1024).toFixed(1) + ' KB';
      }

      var name = data.name || data.path || '未命名';
      var uriHtml = data.uri ? '<span>URI: ' + escapeHtml(data.uri) + '</span>' : '';
      var mimeHtml = mime ? '<span>' + escapeHtml(mime) + '</span>' : '';
      var sizeHtml = sizeStr ? '<span>' + sizeStr + '</span>' : '';

      var actionsHtml = '';
      if (data.encoding === 'base64') {
        actionsHtml = '<button onclick="window.__downloadBase64(' + id + ')">下载文件</button>';
      }
      if (data.encoding === 'text') {
        actionsHtml += '<button class="secondary" onclick="window.__showText(' + id + ')">查看内容</button>';
      }
      if (data.uri) {
        actionsHtml += '<button class="secondary" onclick="window.__copyUri(' + id + ')">复制 URI</button>';
      }

      var statusClass = data.status || '';
      var statusText = statusClass === 'writing' ? '写入中...' : statusClass === 'done' ? '已完成' : statusClass === 'embedded' ? '已嵌入' : '未知';

      card.innerHTML =
        '<div class="artifact-icon">' + icon + '</div>' +
        '<div class="artifact-body">' +
          '<div class="artifact-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</div>' +
          '<div class="artifact-meta">' + mimeHtml + sizeHtml + uriHtml + '</div>' +
          '<div class="artifact-actions" id="actions-' + id + '">' + actionsHtml + '</div>' +
        '</div>' +
        '<span class="artifact-status ' + statusClass + '" id="status-' + id + '">' + statusText + '</span>';

      artifactList.appendChild(card);
      artifacts[id] = { data: data, card: card };
    }

    function updateArtifactStatus(id, status) {
      var el = document.getElementById('status-' + id);
      if (el) {
        el.className = 'artifact-status ' + status;
        var labels = { writing: '写入中...', done: '已完成', failed: '失败', embedded: '已嵌入' };
        el.textContent = labels[status] || '未知';
      }
      if (artifacts[id]) artifacts[id].data.status = status;
    }

    // ---- 全局下载 / 查看 / 复制 ----
    window.__downloadBase64 = function(id) {
      var a = artifacts[id];
      if (!a || !a.data.data) return;
      var binary = atob(a.data.data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: a.data.mime_type || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var aEl = document.createElement('a');
      aEl.href = url;
      aEl.download = a.data.name || ('file_' + id);
      aEl.click();
      URL.revokeObjectURL(url);
    };

    window.__showText = function(id) {
      var a = artifacts[id];
      if (!a || !a.data.data) return;
      var txt = a.data.data.length > 5000 ? a.data.data.slice(0, 5000) + '\n\n...（已截断）' : a.data.data;
      alert(txt);
    };

    window.__copyUri = function(id) {
      var a = artifacts[id];
      if (!a || !a.data.uri) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(a.data.uri);
      }
      alert('URI 已复制：' + a.data.uri);
    };

    // ---- SSE 解析 ----
    async function streamRequest() {
      fullText = '';
      output.innerHTML = '<span class="system">▋ 连接中...</span>';
      artifactList.innerHTML = '';
      artifactList.appendChild(artifactEmpty);
      artifactEmpty.style.display = '';
      toolLog.innerHTML = '';
      artifacts = {};
      artifactCounter = 0;
      updateCharCount();

      sendBtn.disabled = true;
      statusEl.textContent = '流式响应中...';

      var formData = new FormData();
      formData.append('content', contentEl.value || '你好，请介绍一下你自己。');
      for (var i = 0; i < filesEl.files.length; i++) {
        formData.append('files', filesEl.files[i], filesEl.files[i].name);
      }

      var response;
      try {
        response = await fetch(API_URL, { method: 'POST', body: formData });
      } catch (err) {
        output.innerHTML = '<span class="error">网络异常：' + escapeHtml(err.message) + '</span>';
        statusEl.textContent = '失败';
        sendBtn.disabled = false;
        return;
      }

      if (!response.ok) {
        var t = await response.text();
        output.innerHTML = '<span class="error">HTTP ' + response.status + '：' + escapeHtml(t.slice(0, 500)) + '</span>';
        statusEl.textContent = '失败';
        sendBtn.disabled = false;
        return;
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffered = '';

      try {
        while (true) {
          var _ref = await reader.read();
          var value = _ref.value;
          var done = _ref.done;
          if (done) break;
          buffered += decoder.decode(value, { stream: true });

          var lines = buffered.split(/\r?\n/);
          buffered = lines.pop();

          for (var li = 0; li < lines.length; li++) {
            var rawLine = lines[li].trim();
            if (!rawLine || rawLine.indexOf('data:') !== 0) continue;

            var payload = rawLine.slice(5).trim();
            var event;
            try { event = JSON.parse(payload); } catch (e) { continue; }

            if (event.type === 'chunk') {
              fullText += (event.text || '');
              renderText();
              updateCharCount();
            }
            else if (event.type === 'artifact') {
              var artId = ++artifactCounter;
              var artData = {
                status: 'done',
                name: event.name || '',
                mime_type: event.mime_type || '',
                size: event.size,
                uri: event.uri || '',
                description: event.description || ''
              };
              makeArtifactCard(artId, artData);
              logTool('制品链接：' + (event.name || event.uri || ''));
            }
            // ---- 内嵌资源（已合并，不再分片）----
            else if (event.type === 'artifact_embedded') {
              var artId2 = ++artifactCounter;
              var mime2 = event.mime_type || '';
              var embName = mime2 ? 'embedded_' + mime2.replace(/[^a-z0-9]/gi, '_') : 'embedded';
              var embData = {
                status: 'embedded',
                name: embName,
                mime_type: mime2,
                uri: event.uri || '',
                encoding: event.encoding || '',
                data: event.data || ''
              };
              makeArtifactCard(artId2, embData);
              logTool('内嵌资源：' + mime2 + '（' + (event.encoding || '') + '）');
            }
            else if (event.type === 'artifact_writing') {
              var artId3 = ++artifactCounter;
              var path = event.path || '';
              var toolCallId = event.tool_call_id || '';
              var writingData = {
                id: artId3,
                tool_call_id: toolCallId,
                path: path,
                title: event.title || '',
                kind: event.kind || '',
                status: 'writing',
                name: path ? path.split('/').pop().split('\\').pop() : '未知文件'
              };
              makeArtifactCard(artId3, writingData);
              logTool('开始写入：' + (path || event.title || ''));
            }
            else if (event.type === 'artifact_done') {
              // 按 tool_call_id 精确匹配写入中卡片
              var tcid = event.tool_call_id || '';
              var found = false;
              for (var key in artifacts) {
                if (artifacts.hasOwnProperty(key) && artifacts[key].data.tool_call_id === tcid) {
                  updateArtifactStatus(key, 'done');
                  logTool('写入完成：tool_call_id=' + tcid);
                  found = true;
                  break;
                }
              }
              if (!found) {
                logTool('工具调用完成（无匹配写入中卡片）：' + tcid);
              }
            }
            else if (event.type === 'artifact_failed') {
              var tcidF = event.tool_call_id || '';
              for (var keyF in artifacts) {
                if (artifacts.hasOwnProperty(keyF) && artifacts[keyF].data.tool_call_id === tcidF) {
                  updateArtifactStatus(keyF, 'failed');
                  logTool('工具调用失败：tool_call_id=' + tcidF);
                  break;
                }
              }
            }
            else if (event.type === 'done') {
              var doneLine = document.createElement('span');
              doneLine.className = 'done';
              doneLine.textContent = '\n✅ 完成（stop_reason=' + (event.stop_reason || 'unknown') + '）';
              output.appendChild(doneLine);
              output.scrollTop = output.scrollHeight;
              statusEl.textContent = '完成';
              logTool('会话结束，stop_reason=' + (event.stop_reason || 'unknown'));
            }
            else if (event.type === 'error') {
              var errLine = document.createElement('span');
              errLine.className = 'error';
              errLine.textContent = '\n❌ 错误：' + event.message;
              output.appendChild(errLine);
              statusEl.textContent = '错误';
              logTool('错误：' + event.message);
            }
          }
        }
      } catch (err) {
        output.innerHTML += '\n<span class="error">读取异常：' + escapeHtml(err.message) + '</span>';
        statusEl.textContent = '异常';
      } finally {
        sendBtn.disabled = false;
      }
    }

    // ---- 文本渲染（节流，防止 DOM 过大）----
    var renderTimer = null;
    function renderText() {
      if (renderTimer) return;
      renderTimer = setTimeout(function() {
        renderTimer = null;
        var display = fullText;
        if (fullText.length > 50000) {
          display = fullText.slice(-50000) + '\n\n...（内容过长已截断）';
        }
        output.innerHTML = '';
        var span = document.createElement('span');
        span.className = 'assistant';
        span.textContent = display;
        output.appendChild(span);
        output.scrollTop = output.scrollHeight;
      }, 40);
    }

    sendBtn.addEventListener('click', streamRequest);
  </script>
</body>
</html>
