<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 财务分析助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px; }

    .page { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 20px; }

    .card { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); padding: 24px 28px; }
    .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
    .card h2 .dot { width: 8px; height: 8px; border-radius: 50%; background: #2563eb; flex-shrink: 0; }

    label { display: block; font-size: 13px; font-weight: 500; color: #475569; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 88px; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 14px; resize: vertical; transition: border-color .15s; font-family: inherit; }
    textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    input[type=file] { display: block; margin-top: 4px; font-size: 13px; color: #475569; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 6px; }

    .btn-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button { padding: 10px 28px; border: none; border-radius: 10px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s, transform .1s; }
    button:hover { opacity: .92; }
    button:active { transform: scale(.97); }
    button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }
    .btn-outline { background: #fff; color: #2563eb; border: 1.5px solid #2563eb; }
    .btn-outline:hover { background: #eff6ff; opacity: 1; }
    .status { font-size: 13px; color: #64748b; }

    /* 报告预览区 */
    .report-wrap { position: relative; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .report-header .meta { font-size: 11px; background: #eff6ff; color: #2563eb; padding: 2px 10px; border-radius: 20px; font-weight: 500; }
    .report-body { min-height: 200px; max-height: 560px; overflow-y: auto; padding: 24px 28px; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 15px; line-height: 1.85; color: #334155; }
    .report-body h1 { font-size: 22px; font-weight: 700; color: #1e293b; margin: 16px 0 12px; padding-bottom: 8px; border-bottom: 2px solid #e2e8f0; }
    .report-body h2 { font-size: 18px; font-weight: 600; color: #1e293b; margin: 14px 0 10px; }
    .report-body h3 { font-size: 15px; font-weight: 600; color: #334155; margin: 10px 0 8px; }
    .report-body p { margin: 6px 0; }
    .report-body ul, .report-body ol { padding-left: 24px; margin: 8px 0; }
    .report-body li { margin: 4px 0; }
    .report-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .report-body th { background: #f1f5f9; padding: 8px 12px; text-align: left; font-weight: 600; border: 1px solid #e2e8f0; }
    .report-body td { padding: 6px 12px; border: 1px solid #e2e8f0; }
    .report-body tr:nth-child(even) td { background: #f8fafc; }
    .report-body code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
    .report-body pre { background: #0f172a; color: #e2e8f0; padding: 14px 18px; border-radius: 8px; overflow-x: auto; font-size: 13px; line-height: 1.6; margin: 10px 0; }
    .report-body pre code { background: none; padding: 0; }
    .report-body blockquote { border-left: 3px solid #2563eb; padding: 6px 16px; margin: 10px 0; background: #f8fafc; color: #475569; }
    .report-body strong { color: #1e293b; }
    .report-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 16px 0; }

    .report-body .placeholder { text-align: center; padding: 48px 16px; color: #94a3b8; font-size: 14px; }

    /* 文件下载区 */
    .file-list { display: flex; flex-direction: column; gap: 10px; }
    .file-card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 10px; transition: border-color .15s; }
    .file-card:hover { border-color: #93c5fd; }
    .file-icon { width: 36px; height: 36px; border-radius: 8px; background: #eff6ff; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 13px; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .file-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .file-actions button { padding: 5px 12px; font-size: 11px; border-radius: 6px; }
    .empty-state { text-align: center; padding: 32px 16px; color: #94a3b8; font-size: 13px; }

    /* 思考过程 */
    .thought-box { min-height: 60px; max-height: 240px; overflow-y: auto; padding: 14px 18px; background: #1e1b4b; color: #a5b4fc; border-radius: 10px; font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-family: "Menlo", "Consolas", monospace; }
    .thought-box .system { color: #6366f1; font-size: 12px; }

    /* 工具日志 */
    .tool-log { font-size: 12px; color: #64748b; max-height: 160px; overflow-y: auto; padding: 10px 14px; background: #f8fafc; border-radius: 10px; display: flex; flex-direction: column; gap: 4px; font-family: "Menlo", monospace; }
    .tool-log .line { display: flex; gap: 8px; }
    .tool-log .ts { color: #94a3b8; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="page">

    <!-- 输入区 -->
    <div class="card">
      <h2><span class="dot"></span>发送请求</h2>
      <label for="content">输入分析需求</label>
      <textarea id="content" placeholder="请输入内容，例如：请帮我分析这份财务数据，生成一份经营分析报告。"></textarea>

      <label for="files" style="margin-top:16px;">上传 Excel 数据（可选）</label>
      <input id="files" type="file" multiple accept=".xlsx,.xls,.xlsm,.csv" />
      <div class="hint">上传 Excel 后，数据会被自动解析并注入分析上下文。</div>

      <div class="btn-row">
        <button id="sendBtn">开始分析</button>

        <span class="status" id="status">就绪</span>
      </div>
    </div>

    <!-- 报告预览区（渲染 Markdown 为 HTML） -->
    <div class="card report-wrap">
      <div class="report-header">
        <h2 style="margin-bottom:0;"><span class="dot" style="background:#34d399"></span>分析报告</h2>
        <span class="meta" id="charCount">等待分析...</span>
      </div>
      <div class="report-body" id="reportBody">
        <div class="placeholder">👆 上传 Excel 文件并输入分析需求，点击"开始分析"</div>
      </div>
    </div>

    <!-- 文件下载区 -->
    <div class="card">
      <h2><span class="dot" style="background:#f59e0b"></span>生成文件</h2>
      <div class="file-list" id="fileList">
        <div class="empty-state" id="fileEmpty">Agent 生成的文件会显示在这里</div>
      </div>
    </div>

    <!-- 思考过程 -->
    <div class="card" id="thoughtCard">
      <h2><span class="dot" style="background:#a855f7"></span>思考过程 <span style="font-size:11px;font-weight:400;color:#94a3b8;margin-left:8px;" id="thoughtHint"></span></h2>
      <div class="thought-box" id="thoughtBox">
        <span class="system">等待分析...</span>
      </div>
    </div>

    <!-- 工具调用日志 -->
    <div class="card">
      <h2><span class="dot" style="background:#8b5cf6"></span>工具调用日志</h2>
      <div class="tool-log" id="toolLog">
        <span class="system" style="color:#94a3b8;font-size:12px;">等待中...</span>
      </div>
    </div>

    <!-- 执行计划 -->
    <div class="card" id="planCard" style="display:none;">
      <h2><span class="dot" style="background:#ec4899"></span>执行计划</h2>
      <div id="planEntries"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    var sendBtn       = document.getElementById('sendBtn');
    var reportBody    = document.getElementById('reportBody');
    var thoughtBox    = document.getElementById('thoughtBox');
    var statusEl      = document.getElementById('status');
    var contentEl     = document.getElementById('content');
    var filesEl       = document.getElementById('files');
    var charCount     = document.getElementById('charCount');
    var fileList      = document.getElementById('fileList');
    var fileEmpty     = document.getElementById('fileEmpty');
    var toolLog       = document.getElementById('toolLog');
    var planCard      = document.getElementById('planCard');
    var planEntries   = document.getElementById('planEntries');

    var API_URL = '/yyy/workbuddy/chat';

    var fileCounter = 0;
    var filesMap = {};
    var fullText = '';
    var fullThought = '';
    var runtimeId = '';

    function ts() {
      return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function escapeHtml(s) {
      var d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function logTool(text) {
      var span = document.createElement('span');
      span.className = 'line';
      span.innerHTML = '<span class="ts">[' + ts() + ']</span> ' + escapeHtml(text);
      var sysEl = toolLog.querySelector('.system');
      if (sysEl) sysEl.remove();
      toolLog.appendChild(span);
      toolLog.scrollTop = toolLog.scrollHeight;
    }

    // ---- 简单 Markdown → HTML 渲染 ----
    function renderMarkdown(md) {
      if (typeof marked !== 'undefined') {
        try {
          return marked.parse(md);
        } catch(e) {
          // 降级
        }
      }
      // 降级：纯文本 + 换行
      return '<pre style="white-space:pre-wrap;font-family:inherit;">' + escapeHtml(md) + '</pre>';
    }

    function updateReport() {
      if (fullText.length === 0) return;
      reportBody.innerHTML = renderMarkdown(fullText);
      reportBody.scrollTop = reportBody.scrollHeight;
      charCount.textContent = fullText.length + ' 字';
    }

    function updateThought() {
      if (fullThought.length === 0) return;
      thoughtBox.textContent = fullThought;
      thoughtBox.scrollTop = thoughtBox.scrollHeight;
    }

    // ---- 文件卡片 ----
    function makeFileCard(id, data) {
      fileEmpty.style.display = 'none';

      var mime = data.mime_type || '';
      var icon = '';
      if (mime.indexOf('pdf') !== -1) icon = '📄';
      else if (mime.indexOf('html') !== -1) icon = '🌐';
      else if (mime.indexOf('spreadsheet') !== -1 || mime.indexOf('excel') !== -1) icon = '📊';
      else if (mime.indexOf('csv') !== -1) icon = '📋';
      else if (mime.indexOf('image/') === 0) icon = '🖼️';
      else icon = '📁';

      var sizeStr = '';
      if (data.size != null) {
        sizeStr = data.size < 1024 ? data.size + ' B' : (data.size / 1024).toFixed(1) + ' KB';
      }

      var name = data.name || '未命名';
      var mimeStr = mime || '未知类型';

      var actionsHtml = '';
      // resource 内嵌类型：直接 base64/text 下载
      if (data.encoding === 'base64' && data.data) {
        actionsHtml = '<button onclick="window.__downloadBase64(' + id + ')">下载</button>';
      }
      if (data.encoding === 'text' && data.data) {
        actionsHtml += '<button onclick="window.__downloadText(' + id + ')">下载</button>';
      }
      // resource_link 类型：通过后端代理从沙箱下载
      // 沙箱内 URI（如 file:///workspace/report.xlsx）浏览器无法直接访问
      var rid = data._runtime_id || runtimeId;
      if (data.uri && rid) {
        var downloadUrl = '/yyy/workbuddy/download/' + encodeURIComponent(rid) + '?uri=' + encodeURIComponent(data.uri);
        actionsHtml += '<a href="' + downloadUrl + '" style="text-decoration:none;"><button>下载</button></a>';
      } else if (data.uri && !rid) {
        // 没有 runtimeId 时降级为复制链接
        actionsHtml += '<button class="secondary" onclick="navigator.clipboard.writeText(\'' + escapeHtml(data.uri) + '\');alert(\'链接已复制\')">复制链接</button>';
      }

      var card = document.createElement('div');
      card.className = 'file-card';
      card.id = 'file-' + id;
      card.innerHTML =
        '<div class="file-icon">' + icon + '</div>' +
        '<div class="file-info">' +
          '<div class="file-name" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</div>' +
          '<div class="file-meta">' + escapeHtml(mimeStr) + (sizeStr ? ' · ' + sizeStr : '') + '</div>' +
        '</div>' +
        '<div class="file-actions">' + actionsHtml + '</div>';

      fileList.appendChild(card);
      filesMap[id] = { data: data, card: card };
    }

    // ---- 下载 ----
    window.__downloadBase64 = function(id) {
      var f = filesMap[id];
      if (!f || !f.data.data) return;
      var binary = atob(f.data.data);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: f.data.mime_type || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var aEl = document.createElement('a');
      aEl.href = url;
      aEl.download = f.data.name || ('file_' + id);
      aEl.click();
      URL.revokeObjectURL(url);
    };

    window.__downloadText = function(id) {
      var f = filesMap[id];
      if (!f || !f.data.data) return;
      var blob = new Blob([f.data.data], { type: f.data.mime_type || 'text/plain' });
      var url = URL.createObjectURL(blob);
      var aEl = document.createElement('a');
      aEl.href = url;
      aEl.download = f.data.name || ('file_' + id);
      aEl.click();
      URL.revokeObjectURL(url);
    };

    // resource_link 的 uri 就是直接下载链接，已通过 <a download> 处理
    // 不再需要复制链接按钮



    // ---- SSE 事件处理器 ----
    function handleSSEEvent(event) {
      // done / error
      if (event.type === 'done') {
        statusEl.textContent = '分析完成';
        runtimeId = event.runtime_id || '';
        var usageInfo = event.usage ? ' | tokens: ' + event.usage.input_tokens + ' + ' + event.usage.output_tokens : '';
        logTool('分析完成，stop_reason=' + (event.stop_reason || 'unknown') + ' runtime_id=' + runtimeId + usageInfo);

        if (fullThought.length === 0) {
          var thoughtHint = document.getElementById('thoughtHint');
          if (thoughtHint) thoughtHint.textContent = '（Agent 未输出单独思考过程）';
        }

        if (fileCounter === 0 && fullText.length > 0) {
          updateReport();
        } else if (fileCounter === 0) {
          fileEmpty.textContent = 'Agent 未生成文件';
          fileEmpty.style.display = '';
        }
        return;
      }
      if (event.type === 'error') {
        reportBody.innerHTML = '<div class="placeholder" style="color:#f87171;">❌ 错误：' + escapeHtml(event.message) + '</div>';
        statusEl.textContent = '错误';
        logTool('错误：' + event.message);
        return;
      }

      var su = event.session_update;
      if (!su) return;

      switch (su) {
        case 'agent_message_chunk':
          handleContentChunk(event, 'message');
          break;
        case 'agent_thought_chunk':
          handleContentChunk(event, 'thought');
          break;
        case 'user_message_chunk':
          logTool('用户消息回显');
          break;
        case 'tool_call':
          handleToolCall(event);
          break;
        case 'tool_call_update':
          handleToolCallUpdate(event);
          break;
        case 'plan':
          handlePlan(event);
          break;
        case 'usage_update':
          logTool('用量更新：used=' + event.used + ' size=' + event.size);
          break;
        case 'current_mode_update':
          logTool('模式切换：' + (event.current_mode_id || ''));
          break;
        case 'config_option_update':
          logTool('配置更新');
          break;
        case 'available_commands_update':
          logTool('可用命令更新');
          break;
        case 'session_info_update':
          logTool('会话信息更新');
          break;
        default:
          logTool('未知事件：' + su);
      }
    }

    var lastMessageId = null;
    function handleContentChunk(event, kind) {
      var content = event.content;
      if (!content) return;
      var contentType = content.type;

      if (contentType === 'text') {
        var text = content.text || '';
        if (kind === 'message') {
          fullText += text;
          updateReport();
        } else if (kind === 'thought') {
          fullThought += text;
          updateThought();
          var thoughtHint = document.getElementById('thoughtHint');
          if (thoughtHint) thoughtHint.textContent = '（Agent 深度推理过程）';
        }
      }
      else if (contentType === 'resource_link') {
        var fid = ++fileCounter;
        // 优先使用事件级的 _runtime_id（流式过程中注入），否则用全局 runtimeId
        var rid = event._runtime_id || runtimeId;
        makeFileCard(fid, {
          status: 'done',
          name: content.name || content.uri || '未命名',
          mime_type: content.mime_type || '',
          size: content.size,
          uri: content.uri || '',
          description: content.description || '',
          _runtime_id: rid
        });
        logTool('📥 可下载文件：' + (content.name || content.uri || ''));
      }
      else if (contentType === 'resource') {
        var resource = content.resource;
        if (!resource) return;
        var fid2 = ++fileCounter;
        var mime2 = resource.mime_type || '';
        var embName = resource.uri ? resource.uri.split('/').pop() : ('file_' + fid2);
        var blobData = resource.blob || '';
        var textData = resource.text || '';
        makeFileCard(fid2, {
          status: 'embedded',
          name: embName,
          mime_type: mime2,
          uri: resource.uri || '',
          encoding: resource.blob ? 'base64' : 'text',
          data: blobData || textData
        });
        logTool('📊 内嵌文件：' + (mime2 || '未知类型'));
      }
      else if (contentType === 'image') {
        logTool('🖼️ 收到图片');
      }
      else if (contentType === 'audio') {
        logTool('🔊 收到音频');
      }

      if (event.message_id && event.message_id !== lastMessageId) {
        lastMessageId = event.message_id;
        logTool('新消息 id=' + event.message_id);
      }
    }

    function handleToolCall(event) {
      var tcid = event.tool_call_id || '';
      var kind = event.kind || '';
      var title = event.title || '';
      var status = event.status || 'pending';
      var locations = event.locations || [];
      var rawInput = event.raw_input || {};

      var paths = [];
      for (var i = 0; i < locations.length; i++) {
        if (locations[i].path) paths.push(locations[i].path);
      }
      if (!paths.length && rawInput.file_path) paths.push(rawInput.file_path);

      if (paths.length) {
        for (var p = 0; p < paths.length; p++) {
          logTool('📝 工具写入：' + paths[p] + ' (kind=' + kind + ')');
        }
      } else {
        logTool('🔧 工具调用：' + (title || tcid) + ' kind=' + kind);
      }
    }

    function handleToolCallUpdate(event) {
      var tcid = event.tool_call_id || '';
      var status = event.status || '';
      var title = event.title || '';
      var rawOutput = event.raw_output;
      var content = event.content || [];

      if (status === 'completed') {
        logTool('✅ 工具完成：' + (title || tcid));
        for (var c = 0; c < content.length; c++) {
          var item = content[c];
          if (item.type === 'content' && item.content && item.content.type === 'resource_link') {
            var rl = item.content;
            var fid = ++fileCounter;
            var rid2 = event._runtime_id || runtimeId;
            makeFileCard(fid, {
              status: 'done',
              name: rl.name || rl.uri || '未命名',
              mime_type: rl.mime_type || '',
              size: rl.size,
              uri: rl.uri || '',
              description: rl.description || '',
              _runtime_id: rid2
            });
            logTool('📥 可下载文件：' + (rl.name || rl.uri || ''));
          }
        }
      } else if (status === 'failed') {
        logTool('❌ 工具失败：' + (title || tcid));
      } else if (status === 'in_progress') {
        logTool('⏳ 工具执行中：' + (title || tcid));
      }

      if (rawOutput != null) {
        logTool('输出：' + JSON.stringify(rawOutput).slice(0, 200));
      }
    }

    function handlePlan(event) {
      var entries = event.entries || [];
      if (!entries.length) return;
      planCard.style.display = '';
      var html = '';
      for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        var statusIcon = e.status === 'completed' ? '✅' : e.status === 'in_progress' ? '🔄' : e.status === 'pending' ? '⏳' : '❌';
        html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #f1f5f9;">' +
                '<span>' + statusIcon + '</span>' +
                '<span style="flex:1;">' + escapeHtml(e.content || '') + '</span>' +
                '<span style="font-size:11px;color:#94a3b8;">' + escapeHtml(e.priority || '') + '</span>' +
                '</div>';
      }
      planEntries.innerHTML = html;
      logTool('计划更新：' + entries.length + ' 项');
    }

    // ---- SSE 请求 ----
    async function streamRequest() {
      fullText = '';
      fullThought = '';
      reportBody.innerHTML = '<div class="placeholder">▋ 正在分析...</div>';
      thoughtBox.innerHTML = '<span class="system">等待思考过程...</span>';
      fileList.innerHTML = '';
      fileList.appendChild(fileEmpty);
      fileEmpty.style.display = '';
      fileEmpty.textContent = 'Agent 生成的文件会显示在这里';
      toolLog.innerHTML = '<span class="system" style="color:#94a3b8;font-size:12px;">等待中...</span>';
      planCard.style.display = 'none';
      planEntries.innerHTML = '';
      filesMap = {};
      fileCounter = 0;
      runtimeId = '';
      charCount.textContent = '等待分析...';

      sendBtn.disabled = true;
      statusEl.textContent = '分析中...';

      var formData = new FormData();
      formData.append('content', contentEl.value || '请帮我分析这份财务数据');
      for (var i = 0; i < filesEl.files.length; i++) {
        formData.append('files', filesEl.files[i], filesEl.files[i].name);
      }

      var response;
      try {
        response = await fetch(API_URL, { method: 'POST', body: formData });
      } catch (err) {
        reportBody.innerHTML = '<div class="placeholder" style="color:#f87171;">网络异常：' + escapeHtml(err.message) + '</div>';
        statusEl.textContent = '失败';
        sendBtn.disabled = false;
        return;
      }

      if (!response.ok) {
        var t = await response.text();
        reportBody.innerHTML = '<div class="placeholder" style="color:#f87171;">HTTP ' + response.status + '：' + escapeHtml(t.slice(0, 500)) + '</div>';
        statusEl.textContent = '失败';
        sendBtn.disabled = false;
        return;
      }

      var reader = response.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buffered = '';

      try {
        while (true) {
          var _ref = await reader.read();
          var value = _ref.value;
          var done = _ref.done;
          if (done) break;
          buffered += decoder.decode(value, { stream: true });

          var lines = buffered.split(/\r?\n/);
          buffered = lines.pop();

          for (var li = 0; li < lines.length; li++) {
            var rawLine = lines[li].trim();
            if (!rawLine || rawLine.indexOf('data:') !== 0) continue;
            var payload = rawLine.slice(5).trim();
            var event;
            try { event = JSON.parse(payload); } catch (e) { continue; }
            handleSSEEvent(event);
          }
        }
      } catch (err) {
        reportBody.innerHTML += '<div class="placeholder" style="color:#f87171;">读取异常：' + escapeHtml(err.message) + '</div>';
        statusEl.textContent = '异常';
      } finally {
        sendBtn.disabled = false;
        if (fullText.length > 0) {
          updateReport();
        }
        if (fullThought.length === 0) {
          document.getElementById('thoughtHint').textContent = '（Agent 未输出单独思考过程）';
        }
      }
    }

    sendBtn.addEventListener('click', streamRequest);
  </script>
</body>
</html>
